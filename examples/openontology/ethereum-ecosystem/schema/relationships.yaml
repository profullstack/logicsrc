- openontology: "0.1"
  kind: RelationshipType
  id: worksAt
  label: works at
  description: A person is affiliated with an organization.
  from:
    - Person
  to:
    - Organization
  cardinality: many-to-many
  temporal: true
- openontology: "0.1"
  kind: RelationshipType
  id: memberOf
  label: member of
  description: An organization belongs to a larger body.
  from:
    - Organization
  to:
    - Organization
  cardinality: many-to-many
  temporal: true
- openontology: "0.1"
  kind: RelationshipType
  id: worksOn
  label: works on
  description: A person actively contributes work to a project.
  from:
    - Person
  to:
    - Project
  cardinality: many-to-many
  temporal: true
  inverse: hasContributor
- openontology: "0.1"
  kind: RelationshipType
  id: hasContributor
  label: has contributor
  description: Inverse of worksOn.
  from:
    - Project
  to:
    - Person
  cardinality: many-to-many
- openontology: "0.1"
